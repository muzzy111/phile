[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/muzzy111/phile"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
tempfile = "3"
phile-fs = { path = "crates/phile-fs" }
phile-ops = { path = "crates/phile-ops" }
phile-meta = { path = "crates/phile-meta" }
phile-store = { path = "crates/phile-store" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
