name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Rust + UI typecheck)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - run: cargo test --workspace --exclude phile
      - run: cargo clippy --workspace -- -D warnings
      # The mod API is early access and moves between Claude Code releases:
      # report here, never block the app's build on it.
      - name: Claude Code mod (validate + tests)
        continue-on-error: true
        shell: bash
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate claude-mod/phile
          claude plugin test claude-mod/phile

  installer:
    name: Windows installer
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm dlx @tauri-apps/cli@2.12.1 build
        working-directory: src-tauri
      - run: cargo build --release -p phile-agent
      - uses: actions/upload-artifact@v4
        with:
          name: Phile-installer-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/phile-agent.exe
          if-no-files-found: error
